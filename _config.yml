# GitHub Pages Jekyll Configuration
title: "Service Mesh on OpenShift"
description: "Architecture Assessment & Adoption Guide for 40 Microservices"
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# Navigation & Layout Settings
heading_anchors: true
search_enabled: true
search:
  heading_level: 2
  previews: 2

# Enable color scheme (auto, light, or dark)
color_scheme: nil

# Callouts
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red
